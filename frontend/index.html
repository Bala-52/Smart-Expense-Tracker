<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Expense Tracker — Login</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-icon">💰</span>
        <h1>Smart Expense Tracker</h1>
        <p class="tagline">Track spending. See patterns. Save more.</p>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Login</button>
        <button class="tab-btn" data-tab="register">Sign Up</button>
      </div>

      <div id="alertBox" class="alert hidden"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required />

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required />

        <button type="submit" class="btn-primary" id="loginBtn">Login</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="auth-form hidden">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="Jane Doe" required />

        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" required />

        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="At least 6 characters" required />

        <button type="submit" class="btn-primary" id="registerBtn">Create Account</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
