<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Expense Tracker — Dashboard</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="brand-icon">💰</span>
      <span class="brand-name">Smart Expense Tracker</span>
    </div>
    <div class="topbar-right">
      <span id="userGreeting" class="user-greeting"></span>
      <button id="logoutBtn" class="btn-logout">Logout</button>
    </div>
  </header>

  <main class="dashboard">

    <div id="alertBox" class="alert hidden"></div>

    <!-- Summary Cards -->
    <section class="cards-grid">
      <div class="stat-card">
        <p class="stat-label">Total Spent</p>
        <h2 id="totalSpent">₹0</h2>
      </div>
      <div class="stat-card">
        <p class="stat-label">This Month</p>
        <h2 id="thisMonthTotal">₹0</h2>
      </div>
      <div class="stat-card">
        <p class="stat-label">Total Transactions</p>
        <h2 id="expenseCount">0</h2>
      </div>
      <div class="stat-card">
        <p class="stat-label">Top Category</p>
        <h2 id="topCategory">—</h2>
      </div>
    </section>

    <!-- Charts -->
    <section class="charts-grid">
      <div class="chart-card">
        <h3>Spending by Category</h3>
        <canvas id="categoryChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>Last 6 Months Trend</h3>
        <canvas id="trendChart"></canvas>
      </div>
    </section>

    <!-- Add Expense + Table -->
    <section class="content-grid">
      <div class="panel">
        <h3>Add Expense</h3>
        <form id="expenseForm" class="expense-form">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" step="0.01" min="0.01" placeholder="e.g. 250" required />

          <label for="category">Category</label>
          <select id="category" required></select>

          <label for="description">Description</label>
          <input type="text" id="description" placeholder="e.g. Groceries" />

          <label for="date">Date</label>
          <input type="date" id="date" required />

          <button type="submit" class="btn-primary">Add Expense</button>
        </form>
      </div>

      <div class="panel">
        <h3>Recent Expenses</h3>
        <div class="table-wrapper">
          <table id="expenseTable">
            <thead>
              <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Description</th>
                <th>Amount</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="expenseTableBody">
              <!-- rows injected by JS -->
            </tbody>
          </table>
          <p id="emptyState" class="empty-state hidden">No expenses yet. Add your first one!</p>
        </div>
      </div>
    </section>

  </main>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
